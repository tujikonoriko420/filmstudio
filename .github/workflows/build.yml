name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: plugin-sdk
        shell: pwsh
        run: |
          $psdk = "$env:RUNNER_TEMP/psdk"
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git $psdk
          Write-Host "=== estrutura do plugin-sdk ==="
          Get-ChildItem $psdk | Select-Object -ExpandProperty Name
          Write-Host "=== premake / vcxproj / sln encontrados ==="
          Get-ChildItem $psdk -Recurse -Include premake5.lua,*.vcxproj,*.sln,premake5.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          echo "PLUGIN_SDK_DIR=$psdk" >> $env:GITHUB_ENV

          # 1) se ja existe projeto pronto, usa; 2) senao, gera com premake
          $proj = Get-ChildItem $psdk -Recurse -Filter plugin.vcxproj -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "plugin_sa" } | Select-Object -First 1
          if (-not $proj) {
            $lua = Get-ChildItem $psdk -Recurse -Filter premake5.lua | Select-Object -First 1
            if (-not $lua) { throw "premake5.lua nao existe no plugin-sdk; veja a estrutura listada acima" }
            $exes = @()
            $bundled = Get-ChildItem $psdk -Recurse -Filter premake5.exe | Select-Object -First 1
            if ($bundled) { $exes += $bundled.FullName }
            foreach ($v in @("5.0.0-beta7","5.0.0-beta6","5.0.0-beta4")) {
              try {
                $zip = "$env:RUNNER_TEMP/pm-$v.zip"
                Invoke-WebRequest "https://github.com/premake/premake-core/releases/download/v$v/premake-$v-windows.zip" -OutFile $zip
                Expand-Archive $zip "$env:RUNNER_TEMP/pm-$v" -Force
                $exes += "$env:RUNNER_TEMP/pm-$v/premake5.exe"
              } catch { Write-Host "premake $v indisponivel" }
            }
            $env:PLUGIN_SDK_DIR = $psdk
            # compatibilidade: premake antigo nao tem multiprocessorcompile (usado na linha 202 do script)
            $orig = Get-Content $lua.FullName -Raw
            $shim = 'if multiprocessorcompile == nil then function multiprocessorcompile(v) flags { "MultiProcessorCompile" } end end' + "`n"
            if ($orig -notmatch 'function multiprocessorcompile') { Set-Content -Path $lua.FullName -Value ($shim + $orig) -NoNewline }
            foreach ($exe in $exes) {
              Write-Host "Tentando premake: $exe"
              Push-Location $lua.DirectoryName
              & $exe vs2022
              $ok = ($LASTEXITCODE -eq 0)
              Pop-Location
              $proj = Get-ChildItem $psdk -Recurse -Filter plugin.vcxproj | Where-Object { $_.FullName -match "plugin_sa" } | Select-Object -First 1
              if ($ok -and $proj) { break }
            }
          }
          if (-not $proj) { throw "plugin.vcxproj de plugin_sa nao encontrado" }
          Write-Host "Compilando $($proj.FullName)"
          msbuild $proj.FullName /p:Configuration=Release /p:Platform=Win32 /m /p:PlatformToolset=v143
          $lib = Get-ChildItem $psdk -Recurse -Filter plugin.lib | Select-Object -First 1
          if (-not $lib) { throw "plugin.lib nao foi gerada" }
          Write-Host "LIB: $($lib.FullName)"
          echo "PLUGIN_LIB=$($lib.FullName)" >> $env:GITHUB_ENV
      - name: FilmStudio
        run: |
          cmake -S . -B build -A Win32 -DPLUGIN_LIB="$env:PLUGIN_LIB"
          cmake --build build --config Release
      - uses: actions/upload-artifact@v4
        with: { name: FilmStudio-asi, path: build/Release/FilmStudio.asi }
